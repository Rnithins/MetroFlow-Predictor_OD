apiVersion: apps/v1
kind: Deployment
metadata:
  name: metroflownet-backend
  labels:
    app: metroflownet-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: metroflownet-backend
  template:
    metadata:
      labels:
        app: metroflownet-backend
    spec:
      containers:
      - name: backend
        image: metroflownet/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: APP_NAME
          value: "MetroFlowNet API"
        - name: API_PREFIX
          value: "/api/v1"
        - name: MONGODB_URI
          value: "mongodb://metroflownet-mongo:27017"
        - name: MONGODB_DATABASE
          value: "metroflow_predictor"
        - name: CORS_ORIGINS
          value: "*"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: metroflownet-secrets
              key: secret-key
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: metroflownet-backend-service
spec:
  type: ClusterIP
  selector:
    app: metroflownet-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metroflownet-frontend
  labels:
    app: metroflownet-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metroflownet-frontend
  template:
    metadata:
      labels:
        app: metroflownet-frontend
    spec:
      containers:
      - name: frontend
        image: metroflownet/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_BASE_URL
          value: "http://localhost:8000/api/v1"
        - name: BACKEND_URL
          value: "http://metroflownet-backend-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: metroflownet-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: metroflownet-frontend
  ports:
  - port: 80
    targetPort: 3000
